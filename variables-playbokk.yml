---
- name: variables practice
  hosts: webservers
  become : yes
  vars: 
    package_name: tree 
    message: "hello from variables!"

  tasks: 
    - name: package install karo
      apt: 
        name: "{{ package_name }}"
        state: present

    - name: message print karo
      debug: 
        msg: "{{ message }}"


