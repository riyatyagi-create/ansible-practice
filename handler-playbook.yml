---
- name: handler practice
  hosts: webservers
  become: yes

  tasks: 
    - name: nginx install karo
      apt:
        name: nginx
        state: present
      notify: nginx restart karo

    - name: ek file banao
      file: 
        path: /tmp/test-handler.txt
        state: touch 
      notify: nginx restart karo

  handlers: 
      - name: nginx restart karo
        service: 
          name: nginx
          state: restarted
