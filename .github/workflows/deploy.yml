name: Deploy with Ansible

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout karo
        uses: actions/checkout@v2

      - name: Ansible install karo
        run: pip install ansible

      - name: SSH Key setup karo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Inventory banao
        run: |
          echo "[webservers]" > inventory.ini
          echo "${{ secrets.SERVER_IP }} ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory.ini

      - name: Ansible Playbook chalao
        run: ansible-playbook -i inventory.ini install-nginx.yml
